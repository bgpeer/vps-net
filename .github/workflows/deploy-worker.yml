# 青帝机器人（Cloudflare Worker：qingtibot）自动部署
# Cloudflare 后台连 GitHub（Workers Builds）在手机上一直跳回 GitHub 设置页、连不上，改走 GitHub Actions：
# main 上改了 worker.js / wrangler.toml 就部署；也可以在 Actions 页手动点 Run workflow。
#
# 只需要在本仓库 Settings → Secrets and variables → Actions 里填两个：
#   CLOUDFLARE_API_TOKEN   Cloudflare「编辑 Cloudflare Workers」模板建的令牌（只能部署 Worker）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare 账户 ID
# 机器人自己的 TELEGRAM_BOT_TOKEN 照旧只放在 Cloudflare（Worker 的机密），部署不会动它；
# wrangler.toml 里 keep_vars = true，后台填的 SYSTEM_PROMPT / AI_MODEL 也不会被清掉。
name: Deploy qingtibot worker

on:
  push:
    branches: [main]
    paths:
      - "worker.js"
      - "wrangler.toml"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          T: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          A: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$T" ] || [ -z "$A" ]; then
            echo "::error::还没在仓库 Secrets 里填 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 记警告次数的 KV：没有就建一个（名字 qingtibot-warn），id 只在这次部署里临时写进 wrangler.toml，不进仓库。
      # 失败（比如令牌没 KV 权限）不拦部署：机器人照样跑，警告次数退回内存记。
      - name: KV for warnings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          find_id() {
            npx --yes wrangler@4 kv namespace list 2>/dev/null | node -e '
              let s = ""; process.stdin.on("data", d => s += d).on("end", () => {
                try { const n = JSON.parse(s.slice(s.indexOf("["))).find(x => /qingtibot-warn$/.test(x.title)); process.stdout.write(n ? n.id : ""); }
                catch (e) { }
              });'
          }
          id=$(find_id)
          if [ -z "$id" ]; then
            npx --yes wrangler@4 kv namespace create qingtibot-warn >/dev/null 2>&1 || true
            id=$(find_id)
          fi
          if [ -z "$id" ]; then
            echo "::warning::KV 建不了（令牌可能没有 Workers KV 权限），警告次数先记在内存里"
            exit 0
          fi
          echo "::add-mask::$id"
          printf '\n[[kv_namespaces]]\nbinding = "WARN"\nid = "%s"\n' "$id" >> wrangler.toml
          echo "KV 已绑上：WARN"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        # 仓库是公开的，Actions 日志谁都能看：wrangler 会打出 https://qingtibot.<账户子域>.workers.dev，
        # 子域能对上账户主人，过滤掉不留在日志里（失败时的报错照样打出来）
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy 2>&1 | sed -E 's#[^ ]*workers\.dev[^ ]*#<workers.dev 地址已隐藏>#g'
